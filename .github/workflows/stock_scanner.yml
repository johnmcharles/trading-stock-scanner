name: Morning Stock Scanner

on:
  schedule:
    # 12:30 UTC = 8:30 AM EDT (March-November)
    # Change to 13:30 UTC in winter (November-March) for 8:30 AM EST
    - cron: '30 12 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests gspread google-auth

      - name: Run stock scanner
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT:    ${{ secrets.EMAIL_RECIPIENT }}
          SHEETS_ID:          ${{ secrets.SHEETS_ID }}
          SHEETS_CREDENTIALS: ${{ secrets.SHEETS_CREDENTIALS }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
        run: python stock_scanner.py

      - name: Keep repository active (prevent 60-day auto-disable)
        if: success()
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Days since last commit: $days"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (avoid 60-day auto-disable)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
